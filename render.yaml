# Render Blueprint: New > Blueprint > pick this repo. Secrets marked sync:false are entered in the Render dashboard.
services:
  - type: web
    name: cyberfield-whatsapp-assistant
    runtime: docker
    plan: starter            # persistent disks need a paid instance
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: data
      mountPath: /data       # SQLite lives here and survives deploys
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/assistant.db
      - key: LOG_FORMAT
        value: json
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
